<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 汽车贷款审批与风控 Agent · 演示原型</title>
<style>
:root{
  --bg:#F2F4F7; --card:#FFFFFF; --card-2:#F8FAFC;
  --ink:#0F1723; --ink2:#54606F; --ink3:#8892A0;
  --line:#DFE4EA; --line2:#C7CFD9;
  --brand:#1F4E8C; --brand-soft:#E8EFF8; --brand-ink:#163A69;
  --ok:#15704A; --ok-soft:#E4F2EB;
  --warn:#9A6209; --warn-soft:#FBF0DC;
  --bad:#A8291F; --bad-soft:#FAE9E7;
  --mono: ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
  --sans: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:17px} h3{font-size:14px}
a{color:var(--brand)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.demobar{background:#2B2118;color:#F2E4D2;font-size:12px;padding:6px 20px;letter-spacing:.02em}
.appbar{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.appbar .brand{font-weight:600;font-size:15px}
.appbar .who{font-size:12px;color:var(--ink2);background:var(--card-2);border:1px solid var(--line);padding:3px 10px;border-radius:20px}
.appbar .spacer{flex:1}
.wrap{max-width:1320px;margin:0 auto;padding:24px 20px 80px}

.btn{font-family:inherit;font-size:13px;padding:8px 16px;border-radius:6px;border:1px solid var(--line2);background:var(--card);color:var(--ink);cursor:pointer;line-height:1.4}
.btn:hover{border-color:var(--ink3)}
.btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:5px 11px;font-size:12px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
.card+.card{margin-top:16px}
.card h2{margin-bottom:4px}
.sub{color:var(--ink2);font-size:13px}
.muted{color:var(--ink3);font-size:12px}

label.f{display:block;margin-bottom:14px}
label.f span{display:block;font-size:12px;color:var(--ink2);margin-bottom:5px}
input,select{font-family:inherit;font-size:14px;width:100%;padding:8px 10px;border:1px solid var(--line2);border-radius:6px;background:var(--card)}
input:focus,select:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
input[readonly]{background:var(--card-2);color:var(--ink2)}
textarea{font-family:inherit;font-size:14px;width:100%;padding:10px;border:1px solid var(--line2);border-radius:6px;min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 18px}
@media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr}}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--card-2)}

.tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;border:1px solid transparent;white-space:nowrap}
.t-gray{background:#EEF1F4;color:#4A5563} .t-blue{background:var(--brand-soft);color:var(--brand-ink)}
.t-ok{background:var(--ok-soft);color:var(--ok)} .t-warn{background:var(--warn-soft);color:var(--warn)}
.t-bad{background:var(--bad-soft);color:var(--bad)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
@media(max-width:820px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.stat .n{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.02em}
.stat .l{font-size:12px;color:var(--ink2)}

.steps{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap}
.steps div{flex:1;min-width:110px;font-size:12px;padding:8px 10px;border-radius:6px;background:var(--card-2);color:var(--ink3);border:1px solid var(--line)}
.steps div.on{background:var(--brand-soft);color:var(--brand-ink);border-color:#B9CEE6;font-weight:500}
.steps div.done{color:var(--ok);border-color:#C3DFD2;background:var(--ok-soft)}

.tl{list-style:none;padding:0;margin:0}
.tl li{position:relative;padding:0 0 20px 26px;border-left:2px solid var(--line);margin-left:6px}
.tl li:last-child{border-left-color:transparent;padding-bottom:0}
.tl li::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--line2)}
.tl li.done::before{background:var(--ok);border-color:var(--ok)}
.tl li.now::before{background:var(--brand);border-color:var(--brand)}
.tl b{display:block;font-weight:500}

.cols{display:grid;grid-template-columns:1fr 1fr 1.05fr;gap:16px;align-items:start}
@media(max-width:1100px){.cols{grid-template-columns:1fr}}
.col{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.colhd{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card-2)}
.colhd b{font-size:13px} .colhd em{font-style:normal;font-size:11px;color:var(--ink3);display:block}
.colbd{padding:16px}

.fgroup{margin-bottom:18px}
.fgroup>b{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);display:block;margin-bottom:8px}
.frow{padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;background:var(--card)}
.frow.hl{border-color:var(--brand);background:var(--brand-soft)}
.frow .k{font-size:12px;color:var(--ink2)}
.frow .v{font-weight:500}
.chips{margin-top:4px;display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:10px;padding:1px 7px;border-radius:4px;background:#EEF1F4;color:#5B6675;border:1px solid var(--line)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:#C3DFD2}
.chip.ref{background:#F4F0E8;color:#7A6741;border-color:#E4DACA}

.chk{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);font-size:13px}
.chk:last-child{border-bottom:none}

.score{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.score .n{font-family:var(--mono);font-size:42px;font-weight:600;letter-spacing:-.03em;line-height:1}
.bar{margin-bottom:9px;cursor:pointer}
.bar .lb{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.bar .track{height:7px;background:#EDF0F3;border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--brand);border-radius:4px}
.bar:hover .lb{color:var(--brand)}

.note{background:var(--card-2);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:0 6px 6px 0;padding:11px 14px;font-size:13px;color:var(--ink2);margin:14px 0}
.note.warn{border-left-color:var(--warn);background:var(--warn-soft);color:#6E4706}
.note.bad{border-left-color:var(--bad);background:var(--bad-soft);color:#7C1E16}
.hr{height:1px;background:var(--line);margin:18px 0}
.hr.thick{height:2px;background:var(--line2);margin:20px 0}
.center{text-align:center}
.hero{max-width:660px;margin:60px auto;text-align:center}
.hero h1{font-size:30px;margin-bottom:12px}
.rolecards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:32px}
@media(max-width:700px){.rolecards{grid-template-columns:1fr}}
.rolecard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px 20px;cursor:pointer;text-align:left}
.rolecard:hover{border-color:var(--brand)}
.rolecard b{display:block;font-size:16px;margin-bottom:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="demobar">模拟授权 · 测试数据 · 教学演示原型，数据均为合成样本，不代表任何真实金融机构政策 · <b id="apiStatus">正在连接后端 API…</b></div>
<div class="appbar">
  <span class="brand">AI 汽车贷款审批与风控 Agent</span>
  <span class="who" id="who"></span>
  <span class="spacer"></span>
  <span class="muted mono" id="ver"></span>
  <button class="btn sm" onclick="switchRole()">切换角色</button>
  <button class="btn sm" onclick="resetDemo()">重置演示数据</button>
</div>
<div class="wrap" id="app"></div>
<script>
/* ============ 常量与规则版本 ============ */
const RULESET_VERSION = 'rules-v1.0.0';
const FLAT_RATE = 0.0278;
const KEY = 'carloan_demo_v1';

const STATUS = {
  draft:      {label:'草稿',       cls:'t-gray'},
  submitted:  {label:'已提交',     cls:'t-blue'},
  reviewing:  {label:'审核中',     cls:'t-blue'},
  need_info:  {label:'待补充资料', cls:'t-warn'},
  approved:   {label:'已批准',     cls:'t-ok'},
  rejected:   {label:'已拒绝',     cls:'t-bad'}
};

/* ============ 演示案例（三档，一键载入） ============ */
const PRESETS = {
  low: {name:'陈慧玲', nric:'S8••••21F', age:38, residency:'新加坡公民', phone:'9•••4412',
    empType:'全职受雇', employer:'新翼物流私人有限公司', title:'运营主管', empMonths:20,
    incomeDeclared:6000, incomeVerified:6000, education:'本科', marital:'已婚',
    existingMonthly:500, outstanding:12000, latePayments:0, otherLoans:1,
    carModel:'Toyota Corolla Altis 1.6', carPrice:115000, omv:17000, carAge:1,
    downPayment:43700, loanAmount:71300, tenureYears:5},
  medium: {name:'林俊达', nric:'S9••••07D', age:31, residency:'永久居民', phone:'8•••7730',
    empType:'全职受雇', employer:'恒昌建筑工程私人有限公司', title:'项目协调员', empMonths:10,
    incomeDeclared:5000, incomeVerified:4300, education:'大专', marital:'未婚',
    existingMonthly:1000, outstanding:48000, latePayments:1, otherLoans:2,
    carModel:'Honda Civic 1.5 Turbo', carPrice:150000, omv:25000, carAge:4,
    downPayment:60000, loanAmount:90000, tenureYears:7},
  high: {name:'黄伟明', nric:'S9••••55A', age:27, residency:'工作准证', phone:'9•••2038',
    empType:'自雇 / 兼职', employer:'个体经营（网约车）', title:'自雇', empMonths:5,
    incomeDeclared:4200, incomeVerified:2900, education:'中学', marital:'未婚',
    existingMonthly:1200, outstanding:71000, latePayments:3, otherLoans:3,
    carModel:'Mazda 3 1.5', carPrice:130000, omv:18000, carAge:3,
    downPayment:39000, loanAmount:91000, tenureYears:7}
};

/* ============ 存储 ============ */
let S = null;
function blankApp(){
  return {id:null, status:'draft', createdAt:null, submittedAt:null,
    consent:false, myinfoPulled:false, creditPulled:false,
    name:'', nric:'', age:'', residency:'新加坡公民', phone:'',
    empType:'全职受雇', employer:'', title:'', empMonths:'',
    incomeDeclared:'', incomeVerified:'', education:'', marital:'',
    existingMonthly:'', outstanding:'', latePayments:'', otherLoans:'',
    carModel:'', carPrice:'', omv:'', carAge:'',
    downPayment:'', loanAmount:'', tenureYears:5,
    decision:null, officerNote:'', needInfoReason:'', supplementNote:''};
}
function seedData(){
  const apps = [];
  const mk = (preset, status, decision, note) => {
    const a = Object.assign(blankApp(), PRESETS[preset]);
    a.consent = true; a.myinfoPulled = true; a.creditPulled = true;
    a.status = status; a.decision = decision; a.officerNote = note || '';
    return a;
  };
  apps.push(mk('low','approved','Approve','收入与社保记录一致，负债水平低，同意按申请金额批准。'));
  apps.push(mk('medium','reviewing',null,''));
  apps.push(mk('high','rejected','Reject','申报收入与核实收入差异过大，且近12个月逾期3次，风险不可接受。'));
  apps.push(mk('medium','need_info',null,''));
  apps[3].needInfoReason = '请补充最近3个月完整银行流水，用于核对申报收入。';
  apps.push(mk('low','submitted',null,''));
  const now = Date.now();
  apps.forEach((a,i)=>{
    a.id = 'CAR-2026-' + String(i+1).padStart(3,'0');
    a.createdAt = now - (6-i)*86400000;
    a.submittedAt = a.createdAt + 3600000;
    a.name = a.name + ' ' + ['','','','（二次申请）',''][i];
    a.name = a.name.trim();
  });
  apps[3].nric = apps[1].nric;
  const audit = [];
  apps.forEach(a=>{
    audit.push(mkAudit(a.id,'Submitted','Applicant',a.submittedAt,'申请提交，资料项 16 / 16'));
    audit.push(mkAudit(a.id,'Info Retrieved','System',a.submittedAt+60000,'MyInfo Sandbox 模拟授权拉取成功'));
    const r = evaluate(a, apps);
    audit.push(mkAudit(a.id,'Risk Assessed','System',a.submittedAt+120000,'风险分 '+r.score+' / '+r.level+'，建议 '+r.recommendation));
    if(a.status==='approved') audit.push(mkAudit(a.id,'Approved','Officer01',a.submittedAt+7200000,a.officerNote));
    if(a.status==='rejected') audit.push(mkAudit(a.id,'Rejected','Officer01',a.submittedAt+7200000,a.officerNote));
    if(a.status==='need_info') audit.push(mkAudit(a.id,'Info Requested','Officer01',a.submittedAt+5400000,a.needInfoReason));
  });
  return {apps, audit, seq:apps.length, role:null};
}
function mkAudit(appId, action, actor, ts, note){
  return {appId, action, actor, ts, note, modelVersion:RULESET_VERSION};
}
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw){ S = JSON.parse(raw); return; } }catch(e){}
  S = seedData(); save();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function resetDemo(){
  if(!confirm('重置为初始演示数据？当前所有新建的申请会被清空。')) return;
  S = seedData(); save(); location.hash = '#/'; render();
}
function logAudit(appId, action, actor, note){
  S.audit.push(mkAudit(appId, action, actor, Date.now(), note)); save();
}
function findApp(id){ return S.apps.find(a=>a.id===id); }

/* ============ 工具 ============ */
const n = v => Number(v) || 0;
const money = v => 'S$' + n(v).toLocaleString('en-SG',{maximumFractionDigits:0});
const pct = v => (v*100).toFixed(1) + '%';
const fmtTime = ts => { const d = new Date(ts);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ============ 风险规则引擎（确定性，纯函数） ============ */
function ltvCap(omv){ return n(omv) <= 20000 ? 0.70 : 0.60; }
function monthlyPayment(loan, years){
  const y = n(years) || 1;
  return (n(loan) + n(loan)*FLAT_RATE*y) / (y*12);
}
function band(v, table){ for(const [max, score, tag] of table){ if(v < max) return [score, tag]; } return [0,'']; }

function evaluate(a, allApps){
  const factors = [], rules = [], questions = [], hard = [];
  const price = n(a.carPrice), loan = n(a.loanAmount), omv = n(a.omv);
  const cap = ltvCap(omv);
  const ltv = price > 0 ? loan/price : 0;
  const mp = monthlyPayment(loan, a.tenureYears);
  const income = n(a.incomeVerified) || n(a.incomeDeclared);
  const dsr = income > 0 ? (n(a.existingMonthly) + mp)/income : 1;
  const dpRatio = price > 0 ? n(a.downPayment)/price : 0;
  const gap = n(a.incomeVerified) > 0 ? Math.abs(n(a.incomeDeclared)-n(a.incomeVerified))/n(a.incomeVerified) : 0;

  /* --- L0 硬性合规规则：不参与打分，直接决定去向 --- */
  if(price > 0 && ltv > cap + 0.0001)
    hard.push({rule:'MAS-LTV-01', text:'融资比例 '+pct(ltv)+' 超出该 OMV 档位上限 '+pct(cap), action:'Reject'});
  if(n(a.tenureYears) > 7)
    hard.push({rule:'MAS-TENURE-01', text:'贷款期限 '+a.tenureYears+' 年超过 7 年上限', action:'Reject'});
  const missing = requiredMissing(a);
  if(missing.length)
    hard.push({rule:'DOC-COMPLETE-01', text:'必填资料缺失：'+missing.join('、'), action:'Manual Review'});

  /* --- L1 加权评分 --- */
  const add = (id,label,score,tag,fields)=>{ if(score>0){ factors.push({id,label,score,fields}); rules.push(id+' · '+tag); } };
  const base = 8;

  const [sDsr, tDsr] = band(dsr, [[0.30,0,''],[0.40,5,'偿债比 30–40%'],[0.55,12,'偿债比 40–55%'],[99,22,'偿债比超过 55%']]);
  add('DSR','偿债压力 (DSR '+pct(dsr)+')', sDsr, tDsr, ['existingMonthly','incomeVerified','loanAmount']);
  if(sDsr >= 12) questions.push('核实是否存在未申报的其他分期或担保责任');

  const [sDp, tDp] = band(dpRatio, [[0.35,10,'首付低于 35%'],[0.40,7,'首付 35–40%'],[0.45,4,'首付 40–45%'],[99,0,'']]);
  add('DOWN','首付比例 ('+pct(dpRatio)+')', sDp, tDp, ['downPayment','carPrice']);

  const [sInc, tInc] = band(gap, [[0.05,0,''],[0.15,7,'收入差异 5–15%'],[0.30,13,'收入差异 15–30%'],[99,18,'收入差异超过 30%']]);
  add('INCGAP','收入一致性 (差异 '+pct(gap)+')', sInc, tInc, ['incomeDeclared','incomeVerified']);
  if(sInc >= 13) questions.push('要求补充近 3 个月银行流水，核对申报收入口径');

  const em = n(a.empMonths);
  const [sEmp, tEmp] = band(em, [[6,8,'任职不足 6 个月'],[12,6,'任职 6–12 个月'],[24,3,'任职 12–24 个月'],[9999,0,'']]);
  add('EMP','任职稳定性 ('+em+' 个月)', sEmp, tEmp, ['empMonths','employer']);
  if(sEmp >= 6) questions.push('核实当前雇佣关系与试用期状态');

  const lp = n(a.latePayments);
  const [sLate, tLate] = band(lp, [[1,0,''],[2,5,'近12个月逾期 1 次'],[4,11,'近12个月逾期 2–3 次'],[999,15,'近12个月逾期 4 次以上']]);
  add('LATE','历史逾期 ('+lp+' 次)', sLate, tLate, ['latePayments','outstanding']);
  if(sLate >= 11) questions.push('调取逾期明细，确认是否已全部结清');

  const life = n(a.carAge) + n(a.tenureYears);
  const sCar = life > 10 ? 6 : 0;
  add('CAR','车龄与残值 (车龄+期限 '+life+' 年)', sCar, '车龄加期限超过 10 年', ['carAge','tenureYears']);

  /* --- 重复申请检测 --- */
  const dup = (allApps||[]).filter(x => x.nric && x.nric===a.nric && x.id !== a.id);
  if(dup.length){
    factors.push({id:'DUP', label:'重复申请 (同一证件已有 '+dup.length+' 笔)', score:6, fields:['nric']});
    rules.push('DUP · 同一证件号存在其他在途或历史申请');
    questions.push('确认与 '+dup.map(d=>d.id).join('、')+' 是否为同一实际借款用途');
  }

  let score = base + factors.reduce((s,f)=>s+f.score, 0);
  score = Math.max(0, Math.min(100, Math.round(score)));
  const level = score >= 65 ? 'High' : score >= 35 ? 'Medium' : 'Low';
  let rec = level === 'High' ? 'Reject' : level === 'Medium' ? 'Manual Review' : 'Approve';
  const hardReject = hard.find(h=>h.action==='Reject');
  if(hardReject) rec = 'Reject';
  else if(hard.length) rec = 'Manual Review';

  factors.sort((x,y)=>y.score-x.score);
  return {score, level, recommendation:rec, factors, rules, questions, hard,
    modelVersion:RULESET_VERSION, metrics:{ltv, cap, dsr, dpRatio, gap, monthly:mp}};
}

function requiredMissing(a){
  const req = [['name','姓名'],['nric','证件号'],['employer','单位'],['empMonths','任职月数'],
    ['incomeDeclared','申报收入'],['carPrice','车价'],['loanAmount','贷款金额'],['downPayment','首付']];
  return req.filter(([k])=>!a[k] && a[k]!==0).map(([,l])=>l);
}
/* ============ 路由 ============ */
function go(h){ location.hash = h; }
window.addEventListener('hashchange', render);

function switchRole(){
  S.role = null; save(); go('#/');
}
function requireRole(r){
  if(S.role !== r){ go(r==='applicant' ? '#/login/applicant' : '#/login/officer'); return false; }
  return true;
}

function render(){
  const h = (location.hash || '#/').slice(1);
  const p = h.split('/').filter(Boolean);
  document.getElementById('who').textContent =
    S.role === 'applicant' ? '申请人 · applicant@demo.com' :
    S.role === 'officer' ? '信贷审批人员 · Officer01' : '未登录';
  document.getElementById('ver').textContent = RULESET_VERSION;
  const el = document.getElementById('app');
  const v = p[0] || '';
  if(v === '') el.innerHTML = viewHome();
  else if(v === 'login') el.innerHTML = viewLogin(p[1]);
  else if(v === 'apply-home'){ if(!requireRole('applicant')) return; el.innerHTML = viewApplicantHome(); }
  else if(v === 'form'){ if(!requireRole('applicant')) return; el.innerHTML = viewForm(p[1]); }
  else if(v === 'status'){ if(!requireRole('applicant')) return; el.innerHTML = viewStatus(p[1]); }
  else if(v === 'supplement'){ if(!requireRole('applicant')) return; el.innerHTML = viewSupplement(p[1]); }
  else if(v === 'queue'){ if(!requireRole('officer')) return; el.innerHTML = viewQueue(); }
  else if(v === 'case'){ if(!requireRole('officer')) return; el.innerHTML = viewCase(p[1]); }
  else if(v === 'audit'){ if(!requireRole('officer')) return; el.innerHTML = viewAudit(); }
  else el.innerHTML = '<div class="card">页面不存在。<button class="btn sm" onclick="go(\'#/\')">回首页</button></div>';
  window.scrollTo(0,0);
}

function newApplication(){
  S.seq += 1;
  const a = blankApp();
  a.id = 'CAR-2026-' + String(S.seq).padStart(3,'0');
  a.createdAt = Date.now();
  S.apps.push(a); save();
  DRAFT = a.id; STEP = 1;
  go('#/form/' + a.id);
}

/* ============ 申请表 ============ */
let STEP = 1, DRAFT = null;
const STEP_NAMES = ['个人资料','就业与收入','负债与信用','车辆与贷款','确认提交'];

function viewForm(id){
  const a = findApp(id); if(!a) return '<div class="card">申请不存在。</div>';
  DRAFT = id;
  const steps = STEP_NAMES.map((s,i)=>
    `<div class="${i+1===STEP?'on':(i+1<STEP?'done':'')}">${i+1}. ${s}</div>`).join('');
  return `<div style="display:flex;align-items:center;gap:14px;margin-bottom:6px">
      <h1>贷款申请 <span class="mono muted" style="font-size:15px">${a.id}</span></h1>
      <span style="flex:1"></span>
      <span class="muted">一键载入演示案例：</span>
      <button class="btn sm" onclick="loadPreset('low')">低风险</button>
      <button class="btn sm" onclick="loadPreset('medium')">中风险</button>
      <button class="btn sm" onclick="loadPreset('high')">高风险</button>
    </div>
    <p class="sub" style="margin-bottom:18px">共五步。带"模拟授权"的按钮会从测试沙箱拉取固定数据，不连接任何真实系统。</p>
    <div class="steps">${steps}</div>
    <div class="card">${[stepOne,stepTwo,stepThree,stepFour,stepFive][STEP-1](a)}</div>
    <div class="btnrow" style="margin-top:16px">
      ${STEP>1 ? '<button class="btn" onclick="gotoStep(-1)">上一步</button>' : '<button class="btn" onclick="go(\'#/apply-home\')">返回列表</button>'}
      ${STEP<5 ? '<button class="btn pri" onclick="gotoStep(1)">下一步</button>'
               : '<button class="btn pri" onclick="submitApp()">提交申请</button>'}
      <button class="btn" onclick="saveDraft()">保存草稿</button>
    </div>`;
}
function fld(a,k,label,type,ro){
  return `<label class="f"><span>${label}</span><input id="i_${k}" type="${type||'text'}" value="${esc(a[k])}" ${ro?'readonly':''} oninput="setF('${k}',this.value)"></label>`;
}
function setF(k,v){ const a = findApp(DRAFT); if(!a) return; a[k] = v;
  if(['carPrice','loanAmount','downPayment','omv'].includes(k)) refreshLtv(); }
function gotoStep(d){ collect(); STEP = Math.max(1, Math.min(5, STEP+d)); save(); render(); }
function saveDraft(){ collect(); save(); alert('草稿已保存。'); }
function collect(){ save(); }
function loadPreset(kind){
  const a = findApp(DRAFT); if(!a) return;
  Object.assign(a, PRESETS[kind]);
  a.consent = true; a.myinfoPulled = true; a.creditPulled = true;
  save(); render();
}

function stepOne(a){
  return `<h2>个人资料</h2><p class="sub" style="margin-bottom:16px">可手动填写，也可使用模拟授权自动填入并带上来源标记。</p>
    <div class="btnrow" style="margin-bottom:18px">
      <button class="btn pri" onclick="pullMyInfo()">使用 MyInfo 模拟授权填入</button>
      <button class="btn" onclick="toggleScope()">查看授权范围</button>
    </div>
    ${a.myinfoPulled ? '<div class="note">已通过 <b>MyInfo Sandbox</b> 模拟授权填入。来源：MyInfo Sandbox ／ 核验状态：已核验 ／ 更新时间：'+fmtTime(Date.now())+'</div>' : ''}
    <div id="scope" style="display:none" class="note">本次授权范围：姓名、证件号（脱敏）、居留身份、联系方式、单位与职位、任职时间、公积金缴纳记录、学历。授权仅用于本笔汽车贷款审批，不用于营销。</div>
    <label class="f" style="display:flex;gap:8px;align-items:flex-start">
      <input type="checkbox" style="width:auto;margin-top:4px" id="i_consent" ${a.consent?'checked':''} onchange="setF('consent',this.checked)">
      <span style="margin:0">我同意将上述范围内的资料用于本次贷款审批与风险评估</span></label>
    <div class="hr"></div>
    <div class="grid2">
      ${fld(a,'name','姓名')}${fld(a,'nric','证件号（脱敏）')}
      ${fld(a,'age','年龄','number')}
      <label class="f"><span>居留身份</span><select id="i_residency" onchange="setF('residency',this.value)">
        ${['新加坡公民','永久居民','工作准证'].map(x=>`<option ${a.residency===x?'selected':''}>${x}</option>`).join('')}</select></label>
      ${fld(a,'phone','联系电话')}${fld(a,'education','学历（仅供核验）')}
    </div>`;
}
function pullMyInfo(){
  const a = findApp(DRAFT); const p = PRESETS.medium;
  ['name','nric','age','residency','phone','education','marital','employer','title','empMonths']
    .forEach(k=>{ if(!a[k]) a[k] = p[k]; });
  a.myinfoPulled = true; a.consent = true; save(); render();
}
function toggleScope(){ const e = document.getElementById('scope'); e.style.display = e.style.display==='none'?'block':'none'; }

function stepTwo(a){
  const gap = n(a.incomeVerified)>0 ? Math.abs(n(a.incomeDeclared)-n(a.incomeVerified))/n(a.incomeVerified) : 0;
  return `<h2>就业与收入</h2><p class="sub" style="margin-bottom:16px">申报收入由你填写，核实收入来自模拟公积金／社保记录，两者会被系统比对。</p>
    <div class="grid2">
      <label class="f"><span>就业类型</span><select onchange="setF('empType',this.value)">
        ${['全职受雇','自雇 / 兼职','合同制'].map(x=>`<option ${a.empType===x?'selected':''}>${x}</option>`).join('')}</select></label>
      ${fld(a,'employer','单位名称')}${fld(a,'title','职位')}${fld(a,'empMonths','任职月数','number')}
      ${fld(a,'incomeDeclared','申报月收入 (S$)','number')}
      ${fld(a,'incomeVerified','核实月收入 (S$，模拟拉取)','number',true)}
    </div>
    <div class="btnrow"><button class="btn" onclick="pullCpf()">模拟拉取公积金缴纳记录</button></div>
    ${n(a.incomeVerified)>0 ? `<div class="note ${gap>0.15?'warn':''}">申报与核实收入差异 <b>${pct(gap)}</b>${gap>0.15?'　该差异会触发一致性检查，需在审批端说明。':''}</div>` : ''}`;
}
function pullCpf(){ const a = findApp(DRAFT);
  a.incomeVerified = a.incomeVerified || Math.round(n(a.incomeDeclared)*0.87);
  save(); render(); }

function stepThree(a){
  return `<h2>负债与信用</h2><p class="sub" style="margin-bottom:16px">用于计算偿债压力与历史信用表现。</p>
    <div class="btnrow" style="margin-bottom:18px"><button class="btn" onclick="pullCredit()">模拟征信授权拉取</button></div>
    ${a.creditPulled ? '<div class="note">已通过 <b>credit_report_sandbox</b> 模拟拉取。来源：征信沙箱 ／ 核验状态：已核验</div>' : ''}
    <div class="grid2">
      ${fld(a,'existingMonthly','现有每月还款 (S$)','number')}${fld(a,'outstanding','未偿债务总额 (S$)','number')}
      ${fld(a,'latePayments','近12个月逾期次数','number')}${fld(a,'otherLoans','其他在贷笔数','number')}
    </div>`;
}
function pullCredit(){ const a = findApp(DRAFT); a.creditPulled = true;
  if(!a.existingMonthly) Object.assign(a, {existingMonthly:1000, outstanding:48000, latePayments:1, otherLoans:2});
  save(); render(); }

function stepFour(a){
  return `<h2>车辆与贷款</h2><p class="sub" style="margin-bottom:16px">融资比例上限按车辆 OMV 分档：OMV ≤ S$20,000 为 70%，高于 S$20,000 为 60%；贷款期限最长 7 年。</p>
    <div class="grid2">
      ${fld(a,'carModel','车型')}${fld(a,'carPrice','车辆总价含 COE (S$)','number')}
      ${fld(a,'omv','车辆 OMV (S$)','number')}${fld(a,'carAge','车龄（年）','number')}
      ${fld(a,'downPayment','首付金额 (S$)','number')}${fld(a,'loanAmount','贷款金额 (S$)','number')}
      <label class="f"><span>贷款期限（年）</span><select onchange="setF('tenureYears',this.value)">
        ${[1,2,3,4,5,6,7].map(x=>`<option ${n(a.tenureYears)===x?'selected':''}>${x}</option>`).join('')}</select></label>
    </div>
    <div id="ltvbox">${ltvBox(a)}</div>`;
}
function ltvBox(a){
  const price = n(a.carPrice), loan = n(a.loanAmount), cap = ltvCap(a.omv);
  if(!price) return '<div class="note">填写车价与贷款金额后，这里会实时显示融资比例。</div>';
  const ltv = loan/price, over = ltv > cap + 0.0001;
  const mp = monthlyPayment(loan, a.tenureYears);
  return `<div class="note ${over?'bad':''}">
    融资比例 <b>${pct(ltv)}</b>　适用上限 <b>${pct(cap)}</b>　预计月供 <b>${money(mp)}</b>
    ${over ? '<br><b>超出上限，该申请将被直接拒绝。</b>请提高首付或降低贷款金额。' : ''}</div>`;
}
function refreshLtv(){ const b = document.getElementById('ltvbox'); if(b) b.innerHTML = ltvBox(findApp(DRAFT)); }

function stepFive(a){
  const missing = requiredMissing(a);
  const row = (k,v)=>`<div class="chk"><span class="muted">${k}</span><span>${v||'<span class="tag t-warn">未填写</span>'}</span></div>`;
  return `<h2>确认并提交</h2><p class="sub" style="margin-bottom:16px">提交后资料将进入企业审批中台，由审批人员完成人工复核。</p>
    ${missing.length ? `<div class="note warn">以下必填项尚未完成：<b>${missing.join('、')}</b></div>` : '<div class="note">资料完整，可以提交。</div>'}
    <div class="grid2"><div>
      ${row('姓名', esc(a.name))}${row('证件号', esc(a.nric))}${row('单位', esc(a.employer))}
      ${row('任职月数', a.empMonths)}${row('申报月收入', a.incomeDeclared?money(a.incomeDeclared):'')}
    </div><div>
      ${row('车型', esc(a.carModel))}${row('车价', a.carPrice?money(a.carPrice):'')}
      ${row('首付', a.downPayment?money(a.downPayment):'')}${row('贷款金额', a.loanAmount?money(a.loanAmount):'')}
      ${row('贷款期限', a.tenureYears + ' 年')}
    </div></div>
    <div class="note">AI 仅提供风险分析与处理建议，最终批准或拒绝由信贷审批人员作出。</div>`;
}
function submitApp(){
  const a = findApp(DRAFT);
  if(!a.consent){ alert('请先在第 1 步勾选资料使用授权。'); STEP = 1; render(); return; }
  const missing = requiredMissing(a);
  if(missing.length){ alert('以下必填项尚未完成：' + missing.join('、')); return; }
  a.status = 'submitted'; a.submittedAt = Date.now(); save();
  logAudit(a.id, 'Submitted', 'Applicant', '申请提交，资料项 ' + (16-missing.length) + ' / 16');
  logAudit(a.id, 'Info Retrieved', 'System', 'MyInfo Sandbox 模拟授权拉取成功');
  const r = evaluate(a, S.apps);
  logAudit(a.id, 'Risk Assessed', 'System', '风险分 ' + r.score + ' / ' + r.level + '，建议 ' + r.recommendation);
  a.status = 'reviewing'; save();
  go('#/status/' + a.id);
}

/* ============ 状态与时间线 ============ */
function viewStatus(id){
  const a = findApp(id); if(!a) return '<div class="card">申请不存在。</div>';
  const st = STATUS[a.status];
  const done = ['submitted','reviewing','need_info','approved','rejected'].indexOf(a.status);
  const finished = a.status==='approved' || a.status==='rejected';
  const nodes = [
    ['申请提交', '资料已进入审批中台', true],
    ['资料检查', '完整性与一致性核对', done>=0],
    ['AI 风险评估', '生成风险分与处理建议', done>=1],
    ['人工审核', a.status==='need_info' ? '已退回，等待补充资料' : (finished?'已完成':'审批人员处理中'), done>=1],
    ['最终结果', finished ? (a.status==='approved'?'已批准':'已拒绝') : '待定', finished]
  ];
  const li = nodes.map((x,i)=>{
    const cls = x[2] ? (i===nodes.length-1 && !finished ? '' : 'done') : '';
    const now = !x[2] && nodes[i-1] && nodes[i-1][2] ? 'now' : '';
    return `<li class="${cls||now}"><b>${x[0]}</b><span class="muted">${x[1]}</span></li>`;
  }).join('');
  return `<div style="display:flex;align-items:center;gap:14px;margin-bottom:18px">
      <h1>申请 <span class="mono">${a.id}</span></h1>
      <span class="tag ${st.cls}">${st.label}</span><span style="flex:1"></span>
      <button class="btn" onclick="go('#/apply-home')">返回列表</button>
      ${a.status==='need_info' ? `<button class="btn warn" onclick="go('#/supplement/${a.id}')">去补充资料</button>` : ''}
    </div>
    ${a.status==='need_info' ? `<div class="note warn"><b>审批人员要求补充资料：</b>${esc(a.needInfoReason)}</div>` : ''}
    ${a.decision ? `<div class="note ${a.status==='approved'?'':'bad'}"><b>审批结论：${a.decision}</b><br>${esc(a.officerNote)}</div>` : ''}
    <div class="grid2" style="gap:16px">
      <div class="card"><h2>处理进度</h2><div class="hr"></div><ul class="tl">${li}</ul>
        <div class="note">AI 仅提供风险分析，最终决定由信贷审批人员作出。</div></div>
      <div class="card"><h2>申请摘要</h2><div class="hr"></div>
        <div class="chk"><span class="muted">车型</span><span>${esc(a.carModel)}</span></div>
        <div class="chk"><span class="muted">车价</span><span class="mono">${money(a.carPrice)}</span></div>
        <div class="chk"><span class="muted">首付</span><span class="mono">${money(a.downPayment)}</span></div>
        <div class="chk"><span class="muted">贷款金额</span><span class="mono">${money(a.loanAmount)}</span></div>
        <div class="chk"><span class="muted">贷款期限</span><span>${a.tenureYears} 年</span></div>
        <div class="chk"><span class="muted">提交时间</span><span class="mono">${fmtTime(a.submittedAt||a.createdAt)}</span></div>
      </div></div>`;
}

/* ============ 补充资料 ============ */
function viewSupplement(id){
  const a = findApp(id); if(!a) return '<div class="card">申请不存在。</div>';
  return `<h1 style="margin-bottom:18px">补充资料 <span class="mono muted" style="font-size:15px">${a.id}</span></h1>
    <div class="card">
      <div class="note warn"><b>需要补充的内容：</b>${esc(a.needInfoReason || '审批人员未填写具体原因。')}</div>
      <label class="f"><span>说明（可选）</span><textarea id="supnote">${esc(a.supplementNote)}</textarea></label>

function checksHtml(a,r){
  const m = r.metrics;
  const missing = requiredMissing(a);
  const items = [
    ['身份与任职资料', !a.name||!a.nric||!a.employer ? 'Missing' : 'Complete'],
    ['收入与保障资料', !a.incomeDeclared ? 'Missing' : 'Complete'],
    ['信用与负债资料', a.creditPulled ? 'Complete' : 'Missing'],
    ['车辆与贷款资料', !a.carPrice||!a.loanAmount ? 'Missing' : 'Complete']
  ];
  const dup = S.apps.filter(x=>x.nric && x.nric===a.nric && x.id!==a.id);
  const cons = [
    ['申报 vs 核实收入', m.gap > 0.15, '差异 ' + pct(m.gap)],
    ['融资比例 vs 上限', m.ltv > m.cap + 0.0001, pct(m.ltv) + ' / 上限 ' + pct(m.cap)],
    ['首付 + 贷款 vs 车价', Math.abs(n(a.downPayment)+n(a.loanAmount)-n(a.carPrice)) > 1, money(n(a.downPayment)+n(a.loanAmount))],
    ['重复申请检测', dup.length > 0, dup.length ? '同证件 ' + dup.length + ' 笔：' + dup.map(d=>d.id).join('、') : '未发现']
  ];
  return `<div class="fgroup"><b>资料完整性</b>
      ${items.map(([k,v])=>`<div class="chk"><span>${k}</span><span class="tag ${v==='Complete'?'t-ok':'t-warn'}">${v}</span></div>`).join('')}

    <div class="fgroup"><b>一致性检查</b>
      ${cons.map(([k,bad,detail])=>`<div class="chk"><span>${k}<br><span class="muted mono">${detail}</span></span>
        <span class="tag ${bad?'t-warn':'t-ok'}">${bad?'Potential inconsistency':'Consistent'}</span></div>`).join('')}
    </div>
    <div class="fgroup"><b>关键指标</b>

        : '<div class="muted">未触发任何评分规则。</div>'}

let PICK = null;
function pick(d){ PICK = d;
  ['d_ap','d_ri','d_rj'].forEach(i=>document.getElementById(i).style.outline='');
  document.getElementById({'Approve':'d_ap','Request Info':'d_ri','Reject':'d_rj'}[d]).style.outline='3px solid var(--brand)';
  document.getElementById('pickinfo').textContent = '已选择：' + d + '。填写备注后即可确认。';
  chkNote();
}
function chkNote(){
  const ok = PICK && document.getElementById('onote').value.trim().length > 0;
  document.getElementById('confirm').disabled = !ok;
}
function hl(fields){
  document.querySelectorAll('.frow').forEach(e=>e.classList.remove('hl'));
  fields.split(',').forEach(f=>{ const e = document.getElementById('f_'+f); if(e){ e.classList.add('hl');
    e.scrollIntoView({behavior:'smooth', block:'center'}); } });
}
function rerun(id){
  const a = findApp(id);
  const t = Object.assign({}, a, {downPayment:document.getElementById('s_down').value,
    incomeVerified:document.getElementById('s_inc').value});
  t.loanAmount = n(a.carPrice) - n(t.downPayment);
  const r2 = evaluate(t, S.apps), r1 = evaluate(a, S.apps);
  const d = r2.score - r1.score;
  document.getElementById('rerunout').innerHTML = `<div class="note">
    调整后风险分 <b>${r2.score}</b>（原 ${r1.score}，${d>=0?'+':''}${d}）　等级 <b>${r2.level}</b>　建议 <b>${r2.recommendation}</b>
    <br><span class="muted">仅为敏感性测试，不写入案件与审计记录。</span></div>`;
}
function commit(id){
  const a = findApp(id);
  const note = document.getElementById('onote').value.trim();
  if(!PICK || !note) return;
  a.officerNote = note; a.decision = PICK;
  if(PICK==='Approve'){ a.status='approved'; logAudit(id,'Approved','Officer01',note); }
  if(PICK==='Reject'){ a.status='rejected'; logAudit(id,'Rejected','Officer01',note); }
  if(PICK==='Request Info'){ a.status='need_info'; a.needInfoReason = note; a.decision = null;
    logAudit(id,'Info Requested','Officer01',note); }
  save(); PICK = null;
  alert('决定已提交，申请人端状态同时更新，操作已写入审计记录。');
  go('#/queue');
}

const API_BASE = window.CAR_LOAN_API_BASE || 'http://127.0.0.1:8000';
const TOKEN_KEY = 'carloan_api_token';
const ROLE_KEY = 'carloan_api_role';
const originalEvaluate = evaluate;
const APPLICATION_FIELDS = [
  'consent','myinfoPulled','creditPulled',
  'name','nric','age','residency','phone','empType','employer','title','empMonths',
  'incomeDeclared','incomeVerified','education','marital',
  'existingMonthly','outstanding','latePayments','otherLoans',
  'carModel','carPrice','omv','carAge','downPayment','loanAmount','tenureYears'
];
const NUMBER_FIELDS = new Set([
  'age','empMonths','incomeDeclared','incomeVerified','existingMonthly','outstanding',
  'latePayments','otherLoans','carPrice','omv','carAge','downPayment','loanAmount','tenureYears'
]);
const ACTION_LABELS = {
  draft_created:'Draft Created', draft_saved:'Draft Saved', submitted:'Submitted',
  information_retrieved:'Info Retrieved', risk_assessed:'Risk Assessed',
  information_requested:'Info Requested', information_submitted:'Info Submitted',
  approved:'Approved', rejected:'Rejected'
};

function setApiStatus(text, ok){
  const el = document.getElementById('apiStatus');
  if(!el) return;
  el.textContent = text;
  el.style.color = ok ? '#D8F3DC' : '#FFE0B2';
}
function token(){ return sessionStorage.getItem(TOKEN_KEY) || ''; }

async function apiRequest(path, options={}){
  const headers = Object.assign({}, options.headers || {});
  if(options.body && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
  if(token()) headers.Authorization = 'Bearer ' + token();
  let response;
  try{
    response = await fetch(API_BASE + path, Object.assign({}, options, {headers}));
  }catch(error){
    throw new Error('无法连接后端 ' + API_BASE + '。请先运行 backend/run.ps1，并使用 Live Server 打开本页面。');
  }
  const contentType = response.headers.get('content-type') || '';
  const data = contentType.includes('application/json') ? await response.json() : null;
  if(!response.ok){
    const detail = data && data.detail;
    const message = typeof detail === 'string' ? detail :
      detail && detail.message ? detail.message :
      data && data.message ? data.message : 'HTTP ' + response.status;
    const error = new Error(message);
    error.status = response.status;
    error.data = data;
    throw error;
  }
  return data;
}

function toApplicationPayload(a){
  const payload = {};
  APPLICATION_FIELDS.forEach(k=>{
    let value = a[k];
    if(NUMBER_FIELDS.has(k)){
      value = value === '' || value == null ? null : Number(value);
      if(Number.isNaN(value)) value = null;
    }
    payload[k] = value;
  });
  return payload;
}

function normalizeRisk(r){
  if(!r) return null;
  const level = {low:'Low',medium:'Medium',high:'High'}[String(r.level).toLowerCase()] || r.level;
  const recommendation = {
    approve:'Approve', manual_review:'Manual Review', reject:'Reject'
  }[String(r.recommendation).toLowerCase()] || r.recommendation;
  const m = r.metrics || {};
  return {
    score:r.score, level, recommendation,
    factors:r.factors || [], rules:r.rules || [], questions:r.questions || [],
    hard:r.hardRules || r.hard || [],
    modelVersion:r.modelVersion || r.rulesVersion || RULESET_VERSION,
    metrics:{
      ltv:m.ltv || 0, cap:m.cap || 0, dsr:m.dsr || 0,
      dpRatio:m.downPaymentRatio != null ? m.downPaymentRatio : (m.dpRatio || 0),
      gap:m.incomeGap != null ? m.incomeGap : (m.gap || 0),
      monthly:m.monthlyPayment != null ? m.monthlyPayment : (m.monthly || 0)
    }
  };
}

function normalizeAudit(row){
  return {
    id:row.id, appId:row.applicationId,
    action:ACTION_LABELS[row.action] || row.action,
    actor:row.actor, ts:Date.parse(row.createdAt), note:row.note,
    modelVersion:row.modelVersion
  };
}

function replaceApp(updated){
  const index = S.apps.findIndex(a=>a.id===updated.id);
  if(index >= 0) S.apps[index] = updated; else S.apps.push(updated);
  return updated;
}

async function apiSyncAll(){
  const [applications, audits] = await Promise.all([
    apiRequest('/applications'), apiRequest('/audit-logs')
  ]);
  S.apps = applications.items || [];
  S.audit = (audits.items || []).map(normalizeAudit);
  S.seq = S.apps.length;
}

/* 有后端结果时以后端为准；尚未提交的草稿只在界面进行即时预览。 */
evaluate = function(a, allApps){
  return normalizeRisk(a && a.riskAssessment) || originalEvaluate(a, allApps);
};

/* API 版本不再把业务数据写入 localStorage。 */
save = function(){};
load = function(){};
logAudit = function(){};

switchRole = function(){
  sessionStorage.removeItem(TOKEN_KEY);
  sessionStorage.removeItem(ROLE_KEY);
  S = {apps:[], audit:[], seq:0, role:null};
  go('#/');
  render();
};

doLogin = async function(role){
  const u = document.getElementById('lgu').value.trim();
  const p = document.getElementById('lgp').value;
  if(!u){ alert('请输入账号，或点击"一键填入演示账号"。'); return; }
  try{
    setApiStatus('正在登录…', true);
    const body = {role, password:p};
    if(u.includes('@')) body.email = u; else body.staffId = u;
    const result = await apiRequest('/auth/login', {method:'POST', body:JSON.stringify(body)});
    sessionStorage.setItem(TOKEN_KEY, result.accessToken);
    sessionStorage.setItem(ROLE_KEY, result.user.role);
    S.role = result.user.role;
    await apiSyncAll();
    setApiStatus('后端 API 已连接', true);
    go(role === 'applicant' ? '#/apply-home' : '#/queue');
  }catch(error){
    setApiStatus('后端连接失败', false);
    alert(error.message);
  }
};

newApplication = async function(){
  try{
    const created = await apiRequest('/applications', {method:'POST', body:'{}'});
    replaceApp(created);
    DRAFT = created.id; STEP = 1;
    go('#/form/' + created.id);
  }catch(error){ alert(error.message); }
};

async function apiSaveDraft(showMessage){
  const a = findApp(DRAFT); if(!a) return;
  const updated = await apiRequest('/applications/' + encodeURIComponent(a.id), {
    method:'PATCH', body:JSON.stringify(toApplicationPayload(a))
  });
  replaceApp(updated);
  if(showMessage) alert('草稿已保存到后端数据库。');
}

saveDraft = async function(){
  try{ await apiSaveDraft(true); render(); }
  catch(error){ alert(error.message); }
};

gotoStep = async function(d){
  try{
    await apiSaveDraft(false);
    STEP = Math.max(1, Math.min(5, STEP+d));
    render();
  }catch(error){ alert(error.message); }
};

submitApp = async function(){
  const a = findApp(DRAFT);
  if(!a.consent){ alert('请先在第 1 步勾选资料使用授权。'); STEP = 1; render(); return; }
  const missing = requiredMissing(a);
  if(missing.length){ alert('以下必填项尚未完成：' + missing.join('、')); return; }
  try{
    await apiSaveDraft(false);
    const updated = await apiRequest('/applications/' + encodeURIComponent(a.id) + '/submit', {
      method:'POST'
    });
    replaceApp(updated);
    await apiSyncAll();
    go('#/status/' + a.id);
  }catch(error){ alert(error.message); }
};

rerun = async function(id){
  const a = findApp(id);
  const downPayment = Number(document.getElementById('s_down').value);
  const incomeVerified = Number(document.getElementById('s_inc').value);
  const loanAmount = n(a.carPrice) - downPayment;
  try{
    const result = await apiRequest('/applications/' + encodeURIComponent(id) + '/evaluate', {
      method:'POST',
      body:JSON.stringify({persist:false, overrides:{downPayment, incomeVerified, loanAmount}})
    });
    const r2 = normalizeRisk(result), r1 = evaluate(a, S.apps);
    const d = r2.score - r1.score;
    document.getElementById('rerunout').innerHTML = `<div class="note">
      调整后风险分 <b>${r2.score}</b>（原 ${r1.score}，${d>=0?'+':''}${d}）　等级 <b>${r2.level}</b>　建议 <b>${r2.recommendation}</b>
      <br><span class="muted">由后端实时计算，仅为敏感性测试，不写入案件与审计记录。</span></div>`;
  }catch(error){ alert(error.message); }
};

commit = async function(id){
  const note = document.getElementById('onote').value.trim();
  if(!PICK || !note) return;
  const decision = {'Approve':'approve','Reject':'reject','Request Info':'request_info'}[PICK];
  try{
    const updated = await apiRequest('/applications/' + encodeURIComponent(id) + '/decision', {
      method:'POST', body:JSON.stringify({decision, note})
    });
    replaceApp(updated);
    PICK = null;
    await apiSyncAll();
    alert('决定已保存到后端，申请人端状态与审计记录已同步。');
    go('#/queue');
  }catch(error){ alert(error.message); }
};

submitSup = async function(id){
  const note = document.getElementById('supnote').value;
  const files = UPLOADS.map(u=>({
    name:u.name, size:(parseInt(u.size, 10) || 0) * 1024, contentType:'application/pdf'
  }));
  try{
    await apiRequest('/applications/' + encodeURIComponent(id) + '/supplements', {
      method:'POST', body:JSON.stringify({note, files})
    });
    UPLOADS = [];
    await apiSyncAll();
    alert('补充资料元数据已保存到后端，状态更新为审核中。');
    go('#/status/' + id);
  }catch(error){ alert(error.message); }
};

resetDemo = async function(){
  if(S.role !== 'officer'){
    alert('为避免误删演示数据，请先使用审批人员账号登录后再重置。');
    return;
  }
  if(!confirm('重置后端演示数据库？当前所有新建申请会被清空。')) return;
  try{
    await apiRequest('/demo/reset', {method:'POST'});
    await apiSyncAll();
    location.hash = '#/queue';
    render();
    alert('后端演示数据已重置。');
  }catch(error){ alert(error.message); }
};

async function bootstrapApi(){
  S = {apps:[], audit:[], seq:0, role:sessionStorage.getItem(ROLE_KEY) || null};
  document.getElementById('app').innerHTML =
    '<div class="card center" style="margin-top:50px">正在连接后端 API…</div>';
  try{
    await apiRequest('/health');
    setApiStatus('后端 API 已连接', true);
    if(S.role && token()){
      try{ await apiSyncAll(); }
      catch(error){
        if(error.status===401) switchRole(); else throw error;
      }
    }
  }catch(error){
    setApiStatus('后端未连接', false);
  }
  render();
}

/* ============ 启动 API 版本 ============ */
bootstrapApi();

</script>
